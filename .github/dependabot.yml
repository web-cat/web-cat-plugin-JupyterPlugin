version: 2
updates:
  # Monitor Dockerfile for new Anaconda3 releases
  - package-ecosystem: "docker"
    directory: "/"
    schedule:
      interval: "monthly"
    commit-message:
      prefix: "build(docker)"
    labels:
      - "dependencies"
      - "docker"

  # Monitor GitHub Actions workflows for updates
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "monthly"
    commit-message:
      prefix: "ci(actions)"
    labels:
      - "dependencies"
      - "github-actions"

